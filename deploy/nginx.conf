# Install in sites-available and replace mvgogo.example.com with your hostname.
# This file is included inside nginx's http context on Ubuntu.
# Certbot's nginx plugin adds HTTPS and the HTTP redirect after DNS resolves.
limit_req_zone $binary_remote_addr zone=mvgogo_routes_ip:1m rate=6r/m;
limit_req_zone $server_name zone=mvgogo_routes_total:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=mvgogo_places:1m rate=30r/m;
limit_conn_zone $server_name zone=mvgogo_route_connections:1m;

server {
    listen 80;
    server_name mvgogo.example.com;
    server_tokens off;
    client_max_body_size 8k;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 15s;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @mvgogo_busy;

    location @mvgogo_busy {
        default_type application/json;
        return 429 '{"detail":"The server is busy. Please try again in a few seconds."}';
    }

    location = /api/routes {
        limit_conn mvgogo_route_connections 1;
        limit_req zone=mvgogo_routes_ip burst=1 nodelay;
        limit_req zone=mvgogo_routes_total burst=1 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/places {
        limit_req zone=mvgogo_places burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
