[project]
name = "mvgogo"
version = "0.1.0"
description = "Munich public transport and MyRadl trip planner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "erikotoz" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/erikotoz/mvgogo"
Issues = "https://github.com/erikotoz/mvgogo/issues"
Documentation = "https://github.com/erikotoz/mvgogo/tree/main/docs"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
